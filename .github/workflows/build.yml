name: Android 6 build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: API 23 unit and layout checks
        run: ./gradlew :app:testLegacyDebugUnitTest :app:testXxqgDebugUnitTest --no-daemon --max-workers=1 --console=plain
      - name: Build and lint
        run: ./gradlew :app:assembleLegacyDebug :app:assembleLegacyRelease :app:lintLegacyRelease :app:assembleXxqgRelease :app:lintXxqgRelease --no-daemon --max-workers=1 --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/legacy/debug/*.apk
